<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long Division &mdash; Step-by-Step Paper Solution</title>
<style>
  :root {
    --desk-1: #2c3542;
    --desk-2: #1e2530;
    --paper: #fdfaf2;
    --paper-2: #f7efdf;
    --paper-edge: #e7dcc4;
    --rule: #c8bb9d;
    --ink: #22262d;
    --ink-2: #59616e;
    --ink-3: #9aa2af;
    --accent: #1d4ed8;
    --accent-2: #dbe8ff;
    --carry: #c2410c;
    --carry-2: #ffe9d6;
    --good: #15803d;
    --good-2: #dcf5e4;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --cell-w: 2.75rem;
    --cell-h: 2.75rem;
    --left-w: 5.75rem;
    --brk-w: 1.2rem;
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1100px 620px at 18% -12%, rgba(255,255,255,.09), transparent 62%),
      radial-gradient(900px 640px at 112% 112%, rgba(255,255,255,.06), transparent 58%),
      linear-gradient(160deg, var(--desk-1), var(--desk-2));
    min-height: 100vh;
    padding: 26px 18px 44px;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1220px; margin: 0 auto; }

  /* ---------- header ---------- */
  .app-header { color: #eef2f8; margin-bottom: 18px; }
  .app-header h1 {
    margin: 0;
    font-size: clamp(1.35rem, 2.6vw, 1.85rem);
    letter-spacing: .01em;
    font-weight: 650;
  }
  .app-header h1 .glyph {
    display: inline-block;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;
    padding: .05rem .55rem;
    margin-right: .5rem;
    font-family: var(--mono);
  }
  .app-header p { margin: .45rem 0 0; color: #b9c3d2; font-size: .95rem; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: .68rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #a9b5c6;
    font-weight: 600;
  }
  .field input {
    font-family: var(--mono);
    font-size: 1.05rem;
    width: 11.5rem;
    padding: .55rem .7rem;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.93);
    color: var(--ink);
    outline: none;
  }
  .field input:focus { border-color: #7aa2ff; box-shadow: 0 0 0 3px rgba(122,162,255,.35); }
  .divide-sign { font-size: 1.5rem; color: #cdd7e4; padding-bottom: .45rem; }

  button {
    font-family: var(--sans);
    font-size: .92rem;
    font-weight: 600;
    color: #eaf0f8;
    background: rgba(255,255,255,.11);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;
    padding: .62rem 1.05rem;
    cursor: pointer;
    transition: background .15s ease, transform .05s ease, opacity .15s ease;
    white-space: nowrap;
  }
  button:hover { background: rgba(255,255,255,.19); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary {
    background: #2f6bff;
    border-color: #4c82ff;
    box-shadow: 0 6px 18px rgba(47,107,255,.35);
  }
  button.primary:hover { background: #4279ff; }

  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-left: auto;
  }
  .nav .icon-btn {
    font-family: var(--mono);
    font-size: 1.02rem;
    padding: .55rem .85rem;
    min-width: 3.1rem;
    text-align: center;
  }
  /* the play/pause button keeps one fixed size in both states: the icons are
     drawn from boxes rather than glyphs, so font metrics can never change it */
  #btn-play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    font-family: var(--sans);
    font-size: .92rem;
    padding: .55rem .7rem;
    height: 2.4125rem;
    overflow: hidden;
  }
  #btn-play .ico {
    width: 1.15rem;
    height: 1.05rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .22rem;
    flex: none;
  }
  #btn-play .ico.play i {
    width: 0;
    height: 0;
    border-style: solid;
    border-width: .44rem 0 .44rem .74rem;
    border-color: transparent transparent transparent #eaf0f8;
  }
  #btn-play .ico.pause i {
    width: .24rem;
    height: .86rem;
    background: #eaf0f8;
    border-radius: 2px;
  }
  #btn-play .lbl {
    width: 3.35rem;
    height: 1.05rem;
    line-height: 1.05rem;
    text-align: left;
  }

  .delay {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    font-size: .68rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #a9b5c6;
    font-weight: 650;
  }
  .delay input {
    font-family: var(--mono);
    font-size: .95rem;
    width: 5.8rem;
    padding: .55rem .6rem;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.93);
    color: var(--ink);
    outline: none;
  }
  .delay input:focus { border-color: #7aa2ff; box-shadow: 0 0 0 3px rgba(122,162,255,.35); }
  .counter {
    font-family: var(--mono);
    font-size: .88rem;
    color: #d5deea;
    background: rgba(0,0,0,.22);
    border: 1px solid rgba(255,255,255,.12);
    padding: .55rem .8rem;
    border-radius: 10px;
    white-space: nowrap;
  }

  .scrub {
    flex: 1 1 260px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 220px;
  }
  .scrub input[type="range"] { flex: 1 1 auto; min-width: 0; accent-color: #6f9dff; }
  /* fixed floor so wider step numbers cannot nudge the slider */
  .scrub .counter { min-width: 8.6rem; text-align: center; }

  .error {
    flex-basis: 100%;
    color: #ffd2c2;
    font-size: .88rem;
    display: none;
  }
  .error.show { display: block; }

  /* ---------- stage ---------- */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(310px, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 980px) {
    .stage { grid-template-columns: 1fr; }
    .nav { margin-left: 0; }
    .field input { width: 9.5rem; }
  }

  /* ---------- paper ---------- */
  .paper {
    background:
      linear-gradient(180deg, var(--paper), var(--paper-2)),
      repeating-linear-gradient(0deg, rgba(160,140,100,.055) 0 1px, transparent 1px 100%);
    background-blend-mode: multiply;
    border: 1px solid var(--paper-edge);
    border-radius: var(--radius);
    box-shadow: 0 22px 50px rgba(0,0,0,.38), 0 2px 0 rgba(255,255,255,.35) inset;
    padding: 22px 20px 18px;
    overflow-x: auto;
  }
  .paper-caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    color: var(--ink-2);
    font-size: .74rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    font-weight: 650;
    border-bottom: 1px solid var(--paper-edge);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .paper-caption .prob {
    font-family: var(--mono);
    letter-spacing: .04em;
    text-transform: none;
    font-size: .95rem;
    color: var(--ink);
    font-weight: 700;
  }

  .worksheet { min-width: max-content; }

  .wrow { display: flex; align-items: center; }
  .wrow .gut {
    width: var(--left-w);
    flex: none;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: .6rem;
    color: var(--ink-3);
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-weight: 650;
  }

  /* the long-division hook: bar over the dividend plus the curve on its left */
  .brk-slot { width: var(--brk-w); flex: none; align-self: stretch; }
  .div-row .brk-slot {
    border-top: 3px solid var(--rule);
    border-left: 3px solid var(--rule);
    border-top-left-radius: 15px;
  }
  .div-row .cells { border-top: 3px solid var(--rule); }

  .cells { display: flex; }

  .cell {
    width: var(--cell-w);
    height: var(--cell-h);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 1.62rem;
    font-weight: 650;
    color: var(--ink);
    border-radius: 9px;
    transition: background .25s ease, color .25s ease;
    user-select: none;
  }
  .cell.is-blank { color: transparent; }

  /* divisor sitting left of the bracket */
  .gut .divisor {
    font-family: var(--mono);
    font-size: 1.62rem;
    font-weight: 650;
    color: var(--ink);
    padding: .18rem .55rem;
    border-radius: 9px;
    transition: background .25s ease, color .25s ease;
    text-transform: none;
    letter-spacing: 0;
  }
  .gut .divisor.mk-active {
    background: var(--accent-2);
    color: var(--accent);
    box-shadow: 0 0 0 2px rgba(29,78,216,.28) inset;
  }

  /* answer row above the bracket */
  .q-row .cell {
    height: calc(var(--cell-h) + 8px);
    font-size: 1.72rem;
    font-weight: 700;
  }
  .q-row.is-answer .cell { font-size: 2.05rem; font-weight: 750; }
  .div-row .cell { font-size: 1.72rem; }
  .prod-row .cell, .diff-row .cell { color: var(--ink-2); }

  /* marks */
  .cell.mk-band { background: rgba(29,78,216,.11); }
  .cell.mk-active {
    background: var(--accent-2);
    color: var(--accent);
    box-shadow: 0 0 0 2px rgba(29,78,216,.28) inset;
  }
  .cell.mk-new {
    background: var(--carry-2);
    color: var(--carry);
    box-shadow: 0 0 0 2px rgba(194,65,12,.3) inset;
    animation: pop .45s ease;
  }
  .cell.mk-answer {
    background: var(--good-2);
    color: var(--good);
    box-shadow: 0 0 0 2px rgba(21,128,61,.28) inset;
    animation: pop .45s ease;
  }
  @keyframes pop {
    0% { transform: scale(.72); opacity: .25; }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* subtraction rules between a product and its difference */
  .rule-row { margin: 3px 0; }
  .rule-row .rule-cells { align-items: center; }
  .rule-row .rule-pad { height: 0; }
  .rule-row .rulebar {
    height: 0;
    border-top: 2px solid var(--rule);
  }

  /* ---------- step card ---------- */
  .stepcard {
    background: linear-gradient(180deg, #ffffff, #f6f8fc);
    border: 1px solid rgba(255,255,255,.5);
    border-radius: var(--radius);
    box-shadow: 0 22px 50px rgba(0,0,0,.34);
    padding: 20px 20px 22px;
  }
  .badge-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .badge {
    font-size: .68rem;
    letter-spacing: .11em;
    text-transform: uppercase;
    font-weight: 700;
    color: #23406e;
    background: #e3ecff;
    border: 1px solid #c4d7ff;
    border-radius: 999px;
    padding: .32rem .75rem;
  }
  .badge.done { color: #14532d; background: var(--good-2); border-color: #b4e6c3; }
  .step-kind {
    font-family: var(--mono);
    font-size: .74rem;
    color: var(--ink-3);
  }
  .stepcard h2 {
    margin: 0 0 .35rem;
    font-size: 1.12rem;
    line-height: 1.45;
    font-weight: 650;
    color: var(--ink);
    min-height: 3.2em;
  }

  .equation {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: .5rem;
    margin: .9rem 0 .35rem;
  }
  .tok {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 3.35rem;
    padding: .6rem .72rem .55rem;
    border-radius: 12px;
  }
  .tok.val {
    background: #fff;
    border: 1px solid var(--paper-edge);
    box-shadow: 0 2px 0 rgba(20,30,50,.05);
  }
  .tok.val b {
    font-family: var(--mono);
    font-size: 1.52rem;
    line-height: 1.1;
    color: var(--ink);
  }
  .tok.val i {
    font-style: normal;
    font-size: .61rem;
    letter-spacing: .075em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-top: .38rem;
    text-align: center;
    max-width: 8.5rem;
  }
  .tok.op {
    min-width: 1.75rem;
    font-family: var(--mono);
    font-size: 1.45rem;
    color: var(--ink-2);
    background: transparent;
    padding: .2rem;
    align-self: center;
  }
  .tok.eq { min-width: 1.45rem; }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin: .95rem 0 .2rem; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    border-radius: 11px;
    padding: .52rem .82rem;
    font-size: .87rem;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .chip .k {
    font-size: .65rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    opacity: .72;
    font-weight: 700;
  }
  .chip .v { font-family: var(--mono); font-size: 1.08rem; }
  .chip.write { background: var(--good-2); color: #166534; border-color: #b7e6c5; }
  .chip.aux { background: var(--carry-2); color: #9a3412; border-color: #f6c9ab; }
  .chip.none { background: #eef1f6; color: var(--ink-2); border-color: #dde3ec; }

  .note {
    margin: 1rem 0 0;
    color: var(--ink-2);
    font-size: .92rem;
    line-height: 1.62;
    background: #f2f5fb;
    border-left: 3px solid #b9cdf5;
    border-radius: 0 10px 10px 0;
    padding: .75rem .95rem;
  }

  .progress {
    height: 8px;
    border-radius: 999px;
    background: #e3e8f1;
    overflow: hidden;
    margin-top: 16px;
  }
  .progress > i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #2f6bff, #5b8dff);
    border-radius: 999px;
    transition: width .25s ease;
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1><span class="glyph">&divide;</span>Long Division &mdash; Step by Step</h1>
  </header>

  <section class="toolbar" aria-label="Problem setup and navigation">
    <div class="field">
      <label for="inp-dividend">Dividend (inside)</label>
      <input id="inp-dividend" type="number" min="0" max="9999999" step="1" value="1456" inputmode="numeric">
    </div>
    <div class="divide-sign" aria-hidden="true">&divide;</div>
    <div class="field">
      <label for="inp-divisor">Divisor (outside)</label>
      <input id="inp-divisor" type="number" min="1" max="9999999" step="1" value="12" inputmode="numeric">
    </div>
    <button class="primary" id="btn-load">Solve it</button>

    <div class="nav" role="group" aria-label="Step controls">
      <button class="icon-btn" id="btn-first" title="First step" aria-label="First step">&#9198;</button>
      <button class="icon-btn" id="btn-prev" title="Previous step" aria-label="Previous step">&#9664;</button>
      <button class="icon-btn" id="btn-play" title="Play / pause" aria-label="Play or pause"><span class="ico play"><i></i></span><span class="lbl">Play</span></button>
      <button class="icon-btn" id="btn-next" title="Next step" aria-label="Next step">&#9654;</button>
      <button class="icon-btn" id="btn-last" title="Last step" aria-label="Last step">&#9197;</button>
      <label class="delay" for="inp-delay">
        <span>Delay</span>
        <input id="inp-delay" type="number" min="0.1" max="60" step="0.1" value="1.4" inputmode="decimal">
        <span>sec</span>
      </label>
    </div>

    <div class="scrub">
      <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Scrub through steps">
      <div class="counter" id="step-counter">Step 1 / 1</div>
    </div>

    <div class="error" id="error"></div>
  </section>

  <main class="stage">
    <section class="paper" aria-label="Pencil and paper worksheet">
      <div class="paper-caption">
        <span>Worksheet</span>
        <span class="prob" id="prob-label">1456 &divide; 12</span>
      </div>
      <div class="worksheet" id="worksheet"></div>
    </section>

    <aside class="stepcard" aria-live="polite" aria-label="Current step">
      <div class="badge-row">
        <span class="badge" id="phase-badge">Divide</span>
        <span class="step-kind" id="step-kind">divide</span>
      </div>
      <h2 id="step-headline">Enter a problem and press &ldquo;Solve it&rdquo;.</h2>
      <div class="equation" id="step-equation"></div>
      <div class="chips" id="step-chips"></div>
      <p class="note" id="step-note"></p>
      <div class="progress"><i id="progress-bar" style="width:0%"></i></div>
    </aside>
  </main>

</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     helpers
     ============================================================ */
  var PLACES = ['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands',
                'hundred-thousands', 'millions', 'ten-millions', 'hundred-millions', 'billions'];

  function placeName(k) {
    return (k >= 0 && k < PLACES.length) ? PLACES[k] : ('10^' + k);
  }

  function comma(n) {
    return Number(n).toLocaleString('en-US');
  }

  var KIND_LABELS = {
    'select': 'Select',
    'divide': 'Divide',
    'multiply': 'Multiply',
    'subtract': 'Subtract',
    'bring-down': 'Bring down',
    'final': 'Finished'
  };

  /* ============================================================
     solver: builds the ordered list of paper steps + display state

     Column index = place value of the dividend (0 = ones). A digit string is
     written with its last digit at the "LSD column" and grows to the left,
     exactly the way numbers stack on squared paper.
     ============================================================ */
  function solve(dividend, divisor) {
    var dStr = String(dividend);
    var vStr = String(divisor);
    var n = dStr.length;
    var digits = dStr.split('').map(Number);
    var quot = Math.floor(dividend / divisor);
    var remainder = dividend % divisor;

    var qCells = [];      /* { col, text }, reveal order */
    var workRows = [];    /* { kind, cells: [{col,text}], msdCol, rule } */
    var steps = [];

    function snap(hl) {
      return {
        qRevealed: qCells.length,
        rows: workRows.map(function (r) { return { revealed: r.cells.length }; }),
        hl: hl || {}
      };
    }

    /* digit string written with its ones digit at lsdCol */
    function strCells(lsdCol, str) {
      var out = [];
      for (var k = 0; k < str.length; k++) {
        out.push({ col: lsdCol + (str.length - 1 - k), text: str.charAt(k) });
      }
      return out;
    }

    function spanMarks(rowKey, fromCol, toCol, cls) {
      var out = [];
      for (var c = fromCol; c <= toCol; c++) out.push({ row: rowKey, col: c, cls: cls });
      return out;
    }

    /* walk the dividend from the left one digit at a time until the digits
       taken are big enough to divide — each attempt is its own step */
    var cur = 0, curLsd = -1, consumed = 0;
    while (cur < divisor && consumed < n) {
      var sd = digits[consumed];
      var sdCol = n - 1 - consumed;
      cur = cur * 10 + sd;
      consumed++;
      curLsd = n - consumed;

      var enough = cur >= divisor;
      var selMarks = spanMarks('div', curLsd, n - 1, 'mk-active');
      selMarks.push({ row: 'div', col: sdCol, cls: 'mk-new' });

      steps.push({
        kind: 'select',
        phase: 'Divide',
        headline: (consumed === 1 ? 'Start with the ' : 'Add the ') +
          placeName(sdCol) + ' digit of ' + dStr,
        tokens: [
          { v: String(sd), label: placeName(sdCol) + ' digit' }, { op: '&rarr;' },
          { v: String(cur), label: 'digits taken' },
          { op: enough ? '&ge;' : '&lt;' },
          { v: vStr, label: 'divisor' }
        ],
        write: null,
        writePlace: null,
        aux: { label: 'Digits taken', value: String(cur) },
        note: enough
          ? cur + ' is big enough: ' + vStr + ' fits into it, so this is the number to divide.'
          : cur + ' is smaller than ' + vStr + ', so ' + vStr + ' does not fit yet.' +
            (consumed < n ? ' Take the next digit as well.' : ' There are no digits left to add.'),
        view: snap({ divisor: true, marks: selMarks })
      });
    }

    var workKey = 'div';          /* row holding the current working number */
    var workMsd = n - 1;          /* its most-significant column */
    var endLsd = curLsd;          /* ones column of the final working number */

    if (cur < divisor) {
      /* the divisor is bigger than the whole dividend: answer is 0 */
      qCells.push({ col: curLsd, text: '0' });
      steps.push({
        kind: 'divide',
        phase: 'Divide',
        headline: vStr + ' goes into ' + dStr + ' zero times',
        tokens: [
          { v: dStr, label: 'dividend' }, { op: '&divide;' },
          { v: vStr, label: 'divisor' }, { op: '=' },
          { v: '0', label: 'times' }
        ],
        write: '0',
        writePlace: placeName(curLsd) + ' place',
        aux: { label: 'Left over', value: dStr },
        note: vStr + ' is larger than ' + dStr + ', so it fits 0 times. Write 0 above the line &mdash; all of ' +
          dStr + ' is left over.',
        view: snap({
          divisor: true,
          marks: [{ row: 'q', col: curLsd, cls: 'mk-new' }]
        })
      });
      endLsd = curLsd;
    } else {
      while (true) {
        var qd = Math.floor(cur / divisor);
        var prod = qd * divisor;
        var diff = cur - prod;
        var prodStr = String(prod);
        var diffStr = String(diff);

        /* ---------- divide: write the answer digit ---------- */
        var wMarks = spanMarks(workKey, curLsd, workMsd, 'mk-active');
        qCells.push({ col: curLsd, text: String(qd) });

        steps.push({
          kind: 'divide',
          phase: 'Divide',
          headline: 'How many times does ' + vStr + ' go into ' + cur + '?',
          tokens: [
            { v: String(cur), label: 'working number' }, { op: '&divide;' },
            { v: vStr, label: 'divisor' }, { op: '=' },
            { v: String(qd), label: 'times' }
          ],
          write: String(qd),
          writePlace: placeName(curLsd) + ' place',
          aux: { label: 'Left over', value: String(diff) },
          note: vStr + ' fits into ' + cur + ' ' + qd + ' time' + (qd === 1 ? '' : 's') +
            '. Write ' + qd + ' above the ' + placeName(curLsd) + ' digit of ' + dStr + '.',
          view: snap({
            divisor: true,
            marks: wMarks.concat([{ row: 'q', col: curLsd, cls: 'mk-new' }])
          })
        });

        /* ---------- multiply ---------- */
        var prodIdx = workRows.length;
        var prodRow = {
          kind: 'prod',
          cells: strCells(curLsd, prodStr),
          msdCol: curLsd + prodStr.length - 1,
          rule: null
        };
        workRows.push(prodRow);

        var pMarks = wMarks.concat([{ row: 'q', col: curLsd, cls: 'mk-active' }]);
        prodRow.cells.forEach(function (cc) {
          pMarks.push({ row: 'r' + prodIdx, col: cc.col, cls: 'mk-new' });
        });

        steps.push({
          kind: 'multiply',
          phase: 'Multiply',
          headline: 'Multiply the ' + qd + ' by the divisor ' + vStr,
          tokens: [
            { v: String(qd), label: 'answer digit' }, { op: '&times;' },
            { v: vStr, label: 'divisor' }, { op: '=' },
            { v: String(prod), label: 'product' }
          ],
          write: String(prod),
          writePlace: 'below ' + cur,
          aux: null,
          note: qd + ' &times; ' + vStr + ' = ' + prod + '. Write ' + prodStr + ' directly under ' + cur +
            ', keeping the digits lined up.',
          view: snap({ divisor: true, marks: pMarks })
        });

        /* ---------- subtract ---------- */
        var diffIdx = workRows.length;
        var diffRow = {
          kind: 'diff',
          cells: strCells(curLsd, diffStr),
          msdCol: curLsd + diffStr.length - 1,
          rule: { lsdCol: curLsd, len: prodStr.length }
        };
        workRows.push(diffRow);

        var sMarks = wMarks.concat([{ row: 'q', col: curLsd, cls: 'mk-active' }]);
        prodRow.cells.forEach(function (cc) {
          sMarks.push({ row: 'r' + prodIdx, col: cc.col, cls: 'mk-active' });
        });
        diffRow.cells.forEach(function (cc) {
          sMarks.push({ row: 'r' + diffIdx, col: cc.col, cls: 'mk-new' });
        });

        steps.push({
          kind: 'subtract',
          phase: 'Subtract',
          headline: 'Subtract ' + prod + ' from ' + cur,
          tokens: [
            { v: String(cur), label: 'working number' }, { op: '&minus;' },
            { v: String(prod), label: 'product' }, { op: '=' },
            { v: String(diff), label: 'difference' }
          ],
          write: String(diff),
          writePlace: 'below the line',
          aux: null,
          note: 'Draw a line under ' + prodStr + ' and subtract: ' + cur + ' &minus; ' + prod + ' = ' + diff + '.',
          view: snap({ marks: sMarks })
        });

        cur = diff;
        workKey = 'r' + diffIdx;
        workMsd = diffRow.msdCol;
        endLsd = curLsd;

        if (consumed >= n) { remainder = diff; break; }

        /* ---------- bring down (plus any zero answer digits) ---------- */
        var finished = false;
        while (true) {
          var dd = digits[consumed];
          var ddCol = curLsd - 1;
          consumed++;
          var before = cur;
          cur = cur * 10 + dd;
          curLsd = ddCol;
          diffRow.cells.push({ col: ddCol, text: String(dd) });
          endLsd = curLsd;

          var bMarks = spanMarks(workKey, ddCol + 1, workMsd, 'mk-active');
          bMarks.push({ row: 'div', col: ddCol, cls: 'mk-active' });
          bMarks.push({ row: workKey, col: ddCol, cls: 'mk-new' });

          steps.push({
            kind: 'bring-down',
            phase: 'Bring down',
            headline: 'Bring down the ' + placeName(ddCol) + ' digit of ' + dStr,
            tokens: [
              { v: String(before), label: 'so far' }, { op: '&darr;' },
              { v: String(dd), label: placeName(ddCol) + ' digit' }, { op: '=' },
              { v: String(cur), label: 'working number' }
            ],
            write: String(dd),
            writePlace: placeName(ddCol) + ' place',
            aux: null,
            note: 'Bring the ' + dd + ' down beside the ' + before + ' to make ' + cur + '.',
            view: snap({ marks: bMarks })
          });

          if (cur >= divisor) break;

          /* the divisor does not fit: a 0 keeps the answer digits lined up */
          qCells.push({ col: curLsd, text: '0' });

          steps.push({
            kind: 'divide',
            phase: 'Divide',
            headline: vStr + ' goes into ' + cur + ' zero times',
            tokens: [
              { v: String(cur), label: 'working number' }, { op: '&divide;' },
              { v: vStr, label: 'divisor' }, { op: '=' },
              { v: '0', label: 'times' }
            ],
            write: '0',
            writePlace: placeName(curLsd) + ' place',
            aux: { label: 'Left over', value: String(cur) },
            note: 'Write 0 in the answer above the ' + placeName(curLsd) + ' digit so the places stay lined up.' +
              (consumed < n ? ' Then bring down the next digit.'
                            : ' No digits are left, so ' + cur + ' is the remainder.'),
            view: snap({
              divisor: true,
              marks: spanMarks(workKey, curLsd, workMsd, 'mk-active')
                .concat([{ row: 'q', col: curLsd, cls: 'mk-new' }])
            })
          });

          if (consumed >= n) { remainder = cur; finished = true; break; }
        }
        if (finished) break;
      }
    }

    /* ---------- the finished problem ---------- */
    var fMarks = [];
    qCells.forEach(function (q) { fMarks.push({ row: 'q', col: q.col, cls: 'mk-answer' }); });
    if (workRows.length === 0) {
      /* nothing was ever subtracted: the dividend itself is the remainder */
      fMarks = fMarks.concat(spanMarks('div', 0, n - 1, 'mk-answer'));
    } else {
      var remStr = String(remainder);
      fMarks = fMarks.concat(spanMarks('r' + (workRows.length - 1), endLsd, endLsd + remStr.length - 1, 'mk-answer'));
    }

    var fTokens = [
      { v: dStr, label: 'dividend' }, { op: '&divide;' },
      { v: vStr, label: 'divisor' }, { op: '=' },
      { v: comma(quot), label: 'quotient' }
    ];
    if (remainder > 0) fTokens.push({ op: 'R' }, { v: String(remainder), label: 'remainder' });

    steps.push({
      kind: 'final',
      phase: 'Done',
      headline: dStr + ' &divide; ' + vStr + ' = ' + comma(quot) + (remainder > 0 ? ' R ' + remainder : ''),
      tokens: fTokens,
      write: null,
      writePlace: null,
      aux: null,
      note: remainder > 0
        ? vStr + ' goes into ' + dStr + ' ' + comma(quot) + ' time' + (quot === 1 ? '' : 's') +
          ' with ' + remainder + ' left over. The answer is ' + comma(quot) + ' remainder ' + remainder + '.'
        : vStr + ' divides ' + dStr + ' evenly &mdash; nothing is left over.',
      view: snap({ marks: fMarks })
    });

    return {
      dividend: dividend,
      divisor: divisor,
      dStr: dStr,
      vStr: vStr,
      n: n,
      digits: digits,
      quot: quot,
      remainder: remainder,
      qCells: qCells,
      workRows: workRows,
      steps: steps
    };
  }

  /* ============================================================
     worksheet renderer
     ============================================================ */
  function renderWorksheet(sol, step) {
    var v = step.view;
    var n = sol.n;
    var marks = {};
    (v.hl.marks || []).forEach(function (m) { marks[m.row + '#' + m.col] = m.cls; });

    function cell(rowKey, col, text) {
      var cls = ['cell'];
      var mk = marks[rowKey + '#' + col];
      if (mk) cls.push(mk);
      if (text === null || text === undefined || text === '') {
        cls.push('is-blank');
        text = '';
      }
      return '<div class="' + cls.join(' ') + '">' + text + '</div>';
    }

    function cellsHTML(rowKey, map) {
      var h = '';
      for (var c = n - 1; c >= 0; c--) h += cell(rowKey, c, map[c]);
      return h;
    }

    function row(gutHTML, cellsH, extraCls, hook) {
      return '<div class="wrow ' + (extraCls || '') + '">' +
        '<div class="gut">' + (gutHTML || '') + '</div>' +
        '<div class="brk-slot' + (hook ? ' brk-on' : '') + '"></div>' +
        '<div class="cells">' + cellsH + '</div>' +
      '</div>';
    }

    /* a subtraction line drawn under the product digits */
    function ruleRow(lsdCol, len) {
      var leftPos = n - lsdCol - len;
      return '<div class="wrow rule-row">' +
        '<div class="gut"></div><div class="brk-slot"></div>' +
        '<div class="cells rule-cells">' +
          '<div class="rule-pad" style="width:calc(var(--cell-w) * ' + leftPos + ')"></div>' +
          '<div class="rulebar" style="width:calc(var(--cell-w) * ' + len + ')"></div>' +
        '</div></div>';
    }

    var out = [];

    /* the answer above the bracket */
    var qMap = {};
    for (var qi = 0; qi < (v.qRevealed || 0); qi++) {
      qMap[sol.qCells[qi].col] = sol.qCells[qi].text;
    }
    out.push(row('', cellsHTML('q', qMap), 'q-row' + (step.kind === 'final' ? ' is-answer' : '')));

    /* divisor outside, dividend inside the bracket */
    var divMap = {};
    for (var di = 0; di < n; di++) divMap[n - 1 - di] = String(sol.digits[di]);
    out.push(row(
      '<span class="divisor' + (v.hl.divisor ? ' mk-active' : '') + '">' + sol.vStr + '</span>',
      cellsHTML('div', divMap), 'div-row', true
    ));

    /* working rows: products and the differences they are subtracted from */
    sol.workRows.forEach(function (r, ri) {
      var rv = v.rows && v.rows[ri] ? v.rows[ri].revealed : 0;
      if (!rv) return;
      if (r.rule) out.push(ruleRow(r.rule.lsdCol, r.rule.len));
      var map = {};
      for (var k = 0; k < rv; k++) map[r.cells[k].col] = r.cells[k].text;
      out.push(row('', cellsHTML('r' + ri, map), r.kind === 'prod' ? 'prod-row' : 'diff-row'));
    });

    return out.join('');
  }

  /* ============================================================
     step panel renderer
     ============================================================ */
  function renderTokens(tokens) {
    return tokens.map(function (t) {
      if (t.op) {
        return '<span class="tok op' + (t.op === '=' ? ' eq' : '') + '">' + t.op + '</span>';
      }
      return '<span class="tok val"><b>' + t.v + '</b><i>' + t.label + '</i></span>';
    }).join('');
  }

  /* ============================================================
     app state + wiring
     ============================================================ */
  var el = {
    dividend: document.getElementById('inp-dividend'),
    divisor: document.getElementById('inp-divisor'),
    load: document.getElementById('btn-load'),
    first: document.getElementById('btn-first'),
    prev: document.getElementById('btn-prev'),
    play: document.getElementById('btn-play'),
    next: document.getElementById('btn-next'),
    last: document.getElementById('btn-last'),
    scrub: document.getElementById('scrub'),
    delay: document.getElementById('inp-delay'),
    counter: document.getElementById('step-counter'),
    error: document.getElementById('error'),
    worksheet: document.getElementById('worksheet'),
    prob: document.getElementById('prob-label'),
    badge: document.getElementById('phase-badge'),
    kind: document.getElementById('step-kind'),
    headline: document.getElementById('step-headline'),
    equation: document.getElementById('step-equation'),
    chips: document.getElementById('step-chips'),
    note: document.getElementById('step-note'),
    progress: document.getElementById('progress-bar')
  };

  var state = { sol: null, i: 0, timer: null };

  /* the field is in seconds; the timer wants milliseconds */
  function stepDelay() {
    var sec = parseFloat(el.delay.value);
    if (!isFinite(sec)) sec = 1.4;
    return Math.round(Math.max(0.1, Math.min(60, sec)) * 1000);
  }

  function pause() {
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
    el.play.innerHTML = '<span class="ico play"><i></i></span><span class="lbl">Play</span>';
    el.play.title = 'Play';
  }

  function play() {
    if (state.timer || !state.sol) return;
    if (state.i >= state.sol.steps.length - 1) state.i = 0;
    el.play.innerHTML = '<span class="ico pause"><i></i><i></i></span><span class="lbl">Pause</span>';
    el.play.title = 'Pause';
    state.timer = setInterval(function () {
      if (state.i >= state.sol.steps.length - 1) {
        pause();
        return;
      }
      state.i += 1;
      render();
    }, stepDelay());
  }

  function goto(i) {
    if (!state.sol) return;
    state.i = Math.max(0, Math.min(state.sol.steps.length - 1, i));
    render();
  }

  function render() {
    var sol = state.sol;
    if (!sol) return;
    var step = sol.steps[state.i];
    var total = sol.steps.length;

    el.worksheet.innerHTML = renderWorksheet(sol, step);
    el.prob.innerHTML = sol.dStr + ' &divide; ' + sol.vStr;

    el.badge.textContent = step.phase;
    el.badge.className = 'badge' + (step.kind === 'final' ? ' done' : '');
    el.kind.textContent = KIND_LABELS[step.kind] || step.kind;

    el.headline.innerHTML = step.headline;
    el.equation.innerHTML = renderTokens(step.tokens);

    var chips = '';
    if (step.write !== null && step.write !== undefined) {
      chips += '<span class="chip write"><span class="k">Write down</span>' +
        '<span class="v">' + step.write + '</span>' +
        (step.writePlace ? '<span class="k">' + step.writePlace + '</span>' : '') +
        '</span>';
    }
    if (step.aux) {
      chips += '<span class="chip aux"><span class="k">' + step.aux.label + '</span>' +
        '<span class="v">' + step.aux.value + '</span></span>';
    }
    el.chips.innerHTML = chips;
    el.note.innerHTML = step.note;

    el.counter.textContent = 'Step ' + (state.i + 1) + ' / ' + total;
    el.progress.style.width = ((state.i + 1) / total * 100).toFixed(2) + '%';

    el.scrub.max = String(total - 1);
    el.scrub.value = String(state.i);

    el.first.disabled = state.i === 0;
    el.prev.disabled = state.i === 0;
    el.next.disabled = state.i === total - 1;
    el.last.disabled = state.i === total - 1;
  }

  function showError(msg) {
    el.error.textContent = msg;
    el.error.className = 'error show';
  }

  function clearError() {
    el.error.textContent = '';
    el.error.className = 'error';
  }

  function load() {
    pause();
    clearError();

    var rawDividend = el.dividend.value.trim();
    var rawDivisor = el.divisor.value.trim();

    if (!/^\d{1,7}$/.test(rawDividend)) {
      showError('The dividend must be a whole number from 0 to 9,999,999.');
      return;
    }
    if (!/^\d{1,7}$/.test(rawDivisor)) {
      showError('The divisor must be a whole number from 1 to 9,999,999.');
      return;
    }

    var dividend = parseInt(rawDividend, 10);
    var divisor = parseInt(rawDivisor, 10);

    if (divisor === 0) {
      showError('The divisor cannot be 0 — nothing divides by 0.');
      return;
    }

    state.sol = solve(dividend, divisor);
    state.i = 0;

    /* shrink the digit cells if the worksheet is wide */
    var w = state.sol.n;
    el.worksheet.style.setProperty('--cell-w', w > 13 ? '1.85rem' : w > 10 ? '2.15rem' : '2.75rem');

    render();
  }

  el.load.addEventListener('click', load);
  el.first.addEventListener('click', function () { pause(); goto(0); });
  el.prev.addEventListener('click', function () { pause(); goto(state.i - 1); });
  el.next.addEventListener('click', function () { pause(); goto(state.i + 1); });
  el.last.addEventListener('click', function () {
    pause();
    goto(state.sol ? state.sol.steps.length - 1 : 0);
  });
  el.play.addEventListener('click', function () {
    if (state.timer) pause();
    else play();
  });
  el.scrub.addEventListener('input', function () {
    pause();
    goto(parseInt(el.scrub.value, 10) || 0);
  });

  /* changing the delay retunes a running playback right away */
  el.delay.addEventListener('input', function () {
    if (state.timer) {
      pause();
      play();
    }
  });

  el.dividend.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') load();
  });
  el.divisor.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') load();
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

    if (e.key === 'ArrowRight') { pause(); goto(state.i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { pause(); goto(state.i - 1); e.preventDefault(); }
    else if (e.key === 'Home') { pause(); goto(0); e.preventDefault(); }
    else if (e.key === 'End') { pause(); goto(state.sol ? state.sol.steps.length - 1 : 0); e.preventDefault(); }
    else if (e.key === ' ') {
      if (state.timer) pause(); else play();
      e.preventDefault();
    } else if (e.key === 'r' || e.key === 'R') {
      load();
      e.preventDefault();
    }
  });

  /* boot with a classic worked example */
  load();
})();
</script>
</body>
</html>
